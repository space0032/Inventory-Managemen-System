# Application Configuration
spring.application.name=Inventory Management System
server.port=8080

# H2 Database (In-Memory - Zero Installation!)
spring.datasource.url=jdbc:h2:mem:inventorydb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (View Database in Browser)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.inventory.ims=DEBUG

# JWT Configuration
jwt.secret=myInventoryManagementSecretKey2024
jwt.expiration=86400000

# Disable Spring Security default login (we'll implement our own)
spring.security.user.name=admin
spring.security.user.password=admin123
```

**Save the file** (Ctrl+S)

